name: collect-daily-data

on:
  schedule:
    # KST = UTC+9. GitHub 예약 실행은 늦어지거나 아예 빠질 수 있음(2026-11-13 첫날 2회 모두 미실행).
    # 그래서 정각·30분을 피한 시각으로 4번 걸어 둔다. 오늘자 수집본이 이미 있으면 자동으로 건너뛰므로 중복은 무해.
    - cron: "7 22 * * *"    # 07:07 KST
    - cron: "27 22 * * *"   # 07:27 KST
    - cron: "47 22 * * *"   # 07:47 KST
    - cron: "2 23 * * *"    # 08:02 KST — 08:25 브리핑 전 마지막 기회
  workflow_dispatch:         # Actions 탭에서 수동 실행(테스트용). 아무것도 고르지 않으면 평소와 같은 수집.
    inputs:
      no_firecrawl:
        description: "Firecrawl 예비 경로 끄기(크레딧을 쓰지 않음)"
        type: boolean
        default: false
      probe_url:
        description: "이 주소 하나만 Firecrawl로 읽어 로그에 표시(1크레딧, 저장 없음)"
        type: string
        default: ""
      dry_run:
        description: "저장·커밋 없이 점검만(페이지별 수집 경로를 로그에 표시)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect data
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          # 수동 실행은 오늘자 수집본이 있어도 강제 재수집
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          NO_FIRECRAWL: ${{ inputs.no_firecrawl && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PROBE_URL: ${{ inputs.probe_url }}
        run: python -m collector.main

      - name: Commit data
        run: |
          git config user.name "collector-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push
          fi
# checked
